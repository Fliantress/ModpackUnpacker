name: Build Launcher EXE

on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 requests pyinstaller

      - name: Build
        run: |
          pyinstaller --onefile --windowed --name ModpackUnpacker launcher/launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModpackUnpacker-Windows
          path: dist/ModpackUnpacker.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ModpackUnpacker.exe
          generate_release_notes: true
